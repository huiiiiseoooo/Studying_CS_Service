# 테스트 전용 설정: MySQL 대신 메모리 DB(H2, MySQL 호환 모드)를 사용한다.
spring:
  datasource:
    url: jdbc:h2:mem:cstudy;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  cache:
    type: none
app:
  jwt:
    secret: test-only-secret-test-only-secret-test-only-secret
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5173
  media:
    base-url: https://media.example.test
  admin:
    initial-id: tester
    initial-password: tester-password-1234
