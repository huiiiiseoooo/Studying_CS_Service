# 로컬 개발용 MySQL 8 (TC-007).  실행: docker compose up -d   /   종료: docker compose down
# 운영 DB는 이 파일과 무관하게 직접 구성한다.
services:
  mysql:
    image: mysql:8.4
    container_name: cstudy-mysql
    environment:
      MYSQL_DATABASE: cstudy
      MYSQL_USER: cstudy
      MYSQL_PASSWORD: ${DB_PASSWORD:-cstudy-local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cstudy-root-local}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - cstudy-mysql-data:/var/lib/mysql

volumes:
  cstudy-mysql-data:
